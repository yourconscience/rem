description: Inject recent sessions and pinned Desktop sessions at session start
enabled: true
bindings:
  claude:
    events:
      SessionStart:
        - hooks:
            - type: command
              command: ~/.local/share/rem/hooks/session-start.sh
              timeout: 15
  codex:
    events:
      SessionStart:
        - hooks:
            - type: command
              command: ~/.local/share/rem/hooks/session-start.sh
              timeout: 15
  droid:
    events:
      SessionStart:
        - hooks:
            - type: command
              command: ~/.local/share/rem/hooks/session-start.sh
              timeout: 15
  pi:
    codeFile: rem/session-start.pi.ts
  omp:
    codeFile: rem/session-start.omp.ts
